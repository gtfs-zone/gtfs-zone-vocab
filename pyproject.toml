[project]
name = "gtfs-zone-vocab"
version = "0.0.0"
requires-python = ">=3.13"
description = "Shared GTFS vocabularies (route types and families) for the gtfs.zone apps"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "commitizen",
    "pytest>=8.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/gtfs_zone_vocab"]

[tool.hatch.build.targets.sdist]
include = ["python/", "data/", "reference/", "LICENSES/", "LICENSE.txt", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-include = ["scripts/check-route-types"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
version_files = [
    "package.json:\"version\""
]
update_changelog_on_bump = true
major_version_zero = true
bump_message = "chore(release): bump version $current_version -> $new_version"
annotated_tag = true
pre_bump_hooks = [
    "bash -c 'branch=$(git branch --show-current); [ \"$branch\" = \"main\" ] || { echo \"Error: cz bump must be run on main (currently on \\\"$branch\\\")\"; exit 1; }'",
]
